# Weekly update pull requests for every kind of dependency in the project.
# They target dev: releases only gets what was tested there.
version: 2

updates:
  - package-ecosystem: pip
    directory: /panel
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      # One pull request for all the small updates, a separate one for each major version.
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directory: /agent
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    target-branch: dev
    schedule:
      interval: weekly
    ignore:
      # Types follow the Node version we build with, moved by hand from one LTS to the next.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # Base images: python, node, golang.
  - package-ecosystem: docker
    directories: [/, /agent]
    target-branch: dev
    schedule:
      interval: weekly
    ignore:
      # Dependabot can't tell an LTS from a "current" release: Node majors are moved by hand.
      - dependency-name: node
        update-types: [version-update:semver-major]

  # They only run CI: one pull request for all of them, major versions included.
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
