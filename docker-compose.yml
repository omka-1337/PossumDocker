# Started by `make start`; settings come from .env, which `make start` creates on the first run.
name: dockergameserver

services:
  panel:
    build: .
    image: dockergameserver-panel:local
    restart: unless-stopped
    # Same user as the one who ran `make start`, so the data folder stays theirs.
    user: "${DGS_UID:-1000}:${DGS_GID:-1000}"
    ports:
      - "${DGS_PORT:-8080}:8080"
    environment:
      # The panel has no access to Docker at all: it asks the agent.
      DGS_AGENT_URL: http://agent:8081
      DGS_AGENT_TOKEN: "${DGS_AGENT_TOKEN:?missing in .env, run make start}"
      DGS_TIMEZONE: "${DGS_TIMEZONE:-}"
    volumes:
      - "${DGS_DATA_DIR:-./data}:/data"
    networks: [web, agent]
    depends_on:
      agent:
        condition: service_healthy

  # The only part that talks to Docker. It listens on an internal network the panel alone can reach.
  agent:
    build: ./agent
    image: dockergameserver-agent:local
    restart: unless-stopped
    environment:
      DGS_AGENT_TOKEN: "${DGS_AGENT_TOKEN:?missing in .env, run make start}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [agent]

networks:
  web: {}
  # No way out and no published ports.
  agent:
    internal: true
