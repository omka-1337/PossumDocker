# Started by `make start`; settings come from .env, which `make start` creates on the first run.
name: dockergameserver

services:
  panel:
    build: .
    image: dockergameserver-panel:local
    restart: unless-stopped
    # Same user as the one who ran `make start`, so ./data stays theirs.
    user: "${DGS_UID:-1000}:${DGS_GID:-1000}"
    ports:
      - "${DGS_PORT:-8080}:8080"
    environment:
      # The panel reaches Docker only through the proxy below, never through the socket itself.
      DOCKER_HOST: tcp://docker-proxy:2375
      DGS_TIMEZONE: "${DGS_TIMEZONE:-}"
    volumes:
      - ./data:/data
    networks: [web, docker]
    depends_on: [docker-proxy]

  # Lets the panel use only the parts of the Docker API it needs: containers, images, volumes, exec.
  # Temporary: before the first release this role moves to the agent.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      IMAGES: 1
      VOLUMES: 1
      EXEC: 1
      POST: 1
      ALLOW_START: 1
      ALLOW_STOP: 1
      ALLOW_RESTARTS: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [docker]

networks:
  web: {}
  # No way out and no published ports: only the panel can talk to the proxy.
  docker:
    internal: true
