[project]
name = "possumdocker-panel"
version = "0.1.0"
description = "Web panel for self-hosted game servers running in Docker"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0.35",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "cronsim>=2.6",
    "argon2-cffi>=23.1",
    # Time zone data for slim containers without /usr/share/zoneinfo.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.30"]
# Talking to Docker without the agent: development only.
docker = ["aiodocker>=0.24"]
dev = [
    "aiodocker>=0.24",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
# A `timeout` argument that is passed on to Docker is fine.
ignore = ["ASYNC109"]
