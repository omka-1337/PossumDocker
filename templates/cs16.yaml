id: cs16
name: Counter-Strike 1.6
description: Classic GoldSrc server (HLDS).

fields:
  - id: map
    label: Start map
    type: select
    default: de_dust2
    options: [de_dust2, de_inferno, de_nuke, de_train, cs_office, cs_italy]
    editable: true
    on_change: restart

  - id: max_players
    label: Max players
    type: number
    default: 20
    min: 2
    max: 32
    editable: true
    on_change: restart

  - id: rcon_password
    label: RCON password
    type: secret
    generate: true
    hidden: true

ports:
  - { name: game, container: 27015, protocol: udp, default_host: 27015 }

install:
  image: steamcmd/steamcmd:latest
  script: install/cs16.sh

runtime:
  # The steamcmd image already has the 32-bit libraries HLDS needs.
  image: steamcmd/steamcmd:latest
  # "$@" passes the command items through as separate arguments, never re-parsed by the shell.
  entrypoint: ["sh", "-c", 'cd /data && exec ./hlds_run "$@"', "hlds"]
  command:
    - -game
    - cstrike
    - -port
    - "27015"
    - +map
    - "{{ map }}"
    - +maxplayers
    - "{{ max_players }}"
    - +rcon_password
    - "{{ rcon_password }}"
  stop:
    command: quit
    timeout: 15
  data_path: /data

query:
  protocol: goldsrc
