id: cs16
name: Counter-Strike 1.6
description: Classic GoldSrc server (HLDS).
icon: icons/cs16.svg
color: "#c9862e"
steam_appid: 10

fields:
  - id: map
    label: Start map
    type: select
    default: de_dust2
    options: [de_dust2, de_inferno, de_nuke, de_train, cs_office, cs_italy]
    editable: true
    on_change: restart

  - id: max_players
    label: Max players
    type: number
    default: 20
    min: 2
    max: 32
    editable: true
    on_change: restart

  - id: vac
    label: Valve Anti-Cheat (VAC)
    type: boolean
    default: true
    help: Turn off for LAN parties or non-Steam clients. The server is then listed as insecure.
    editable: true
    on_change: restart

  - id: rcon_password
    label: RCON password
    type: secret
    generate: true
    hidden: true

ports:
  - { name: game, container: 27015, protocol: udp, default_host: 27015 }

install:
  image: steamcmd/steamcmd:latest
  script: install/cs16.sh

runtime:
  # The steamcmd image already has the 32-bit libraries HLDS needs.
  image: steamcmd/steamcmd:latest
  # hlds_linux, not the hlds_run wrapper: the wrapper restarts the server after `quit`.
  # "$@" passes the command items through as separate arguments, never re-parsed by the shell.
  entrypoint: ["sh", "-c", 'cd /data && LD_LIBRARY_PATH=. exec ./hlds_linux "$@"', "hlds"]
  command:
    - -game
    - cstrike
    - -port
    - "27015"
    - +map
    - "{{ map }}"
    - +maxplayers
    - "{{ max_players }}"
    - +rcon_password
    - "{{ rcon_password }}"
    # An empty item is dropped, so this adds -insecure only when VAC is off.
    - "{{ '' if vac else '-insecure' }}"
    # Joins and leaves in the console: the players tab reads them.
    - +log
    - "on"
    - +mp_logecho
    - "1"
  stop:
    command: quit
    timeout: 15
  data_path: /data
  resources:
    # The game itself is about 900 MB.
    disk_mb: "2048"
    # HLDS itself needs well under 100 MB; room for AMX Mod X and plugins.
    memory_mb: "512"

config_files:
  - id: server_cfg
    label: server.cfg
    path: cstrike/server.cfg
    format: cvars
    # Passed on the command line by the panel; a value here would override it.
    managed: [rcon_password]
    hints:
      hostname: { label: Server name in the browser }
      sv_password: { label: Join password, help: Leave empty for a public server. }
      mp_timelimit: { label: Map time limit (minutes), type: number, min: 0, max: 1440 }
      mp_roundtime: { label: Round time (minutes) }
      mp_freezetime: { label: Freeze time (seconds), type: number, min: 0, max: 60 }
      mp_friendlyfire: { label: Friendly fire, type: boolean, true_value: "1", false_value: "0" }
      mp_autoteambalance: { label: Auto team balance, type: boolean, true_value: "1", false_value: "0" }
      sv_alltalk: { label: All talk, type: boolean, true_value: "1", false_value: "0" }

backup:
  # The game itself (~900 MB) can always be installed again; keep what admins change.
  paths:
    - cstrike/addons
    - cstrike/maps
    - cstrike/server.cfg
    - cstrike/mapcycle.txt
    - cstrike/motd.txt
    - cstrike/banned.cfg
    - cstrike/listip.cfg

players:
  # SteamIDs; LAN clients (VAC off) all share one id, so they are told apart by name.
  key: id
  id_pattern: 'STEAM_\d:\d:\d+'
  ignore: '<BOT>'
  events:
    # The server log, echoed to the console ("+log on" in the command line):
    # L 09/16/2026 - 17:00:00: "Steve<2><STEAM_ID_PENDING><>" connected, address "203.0.113.9:27005"
    - { type: info, pattern: '^L \d\d/\d\d/\d{4} - \d\d:\d\d:\d\d: "(?P<name>.+)<(?P<slot>\d+)><(?P<id>[^>]*)><[^>]*>" connected, address "(?P<ip>[^":]+)(?::\d+)?"$' }
    - { type: join, pattern: '^L \d\d/\d\d/\d{4} - \d\d:\d\d:\d\d: "(?P<name>.+)<(?P<slot>\d+)><(?P<id>[^>]*)><[^>]*>" entered the game$' }
    - { type: leave, pattern: '^L \d\d/\d\d/\d{4} - \d\d:\d\d:\d\d: "(?P<name>.+)<(?P<slot>\d+)><(?P<id>[^>]*)><[^>]*>" disconnected$' }
  status:
    command: status
    # "players : 1 active (20 max)", then a line per player
    answer: '^players\s*:\s*\d+\s+active'
    # "#  1 "Steve"  2 STEAM_0:1:12345   0 01:23   25    0 203.0.113.9:27005"
    row: '^#\s*\d+\s+"(?P<name>.*)"\s+(?P<slot>\d+)\s+(?P<id>\S+)\s+-?\d+\s+\S+\s+\d+\s+\d+\s+(?P<ip>[\d.]+):\d+'
  kick: ["kick #{{ slot }}"]
  bans:
    by: id
    add: ["banid 0 {{ id }} kick", "writeid"]
    remove: ["removeid {{ id }}", "writeid"]
    file: { path: cstrike/banned.cfg, format: lines, pattern: '^banid\s+\S+\s+(\S+)', line: "banid 0.000000 {{ id }}" }
  ip_bans:
    add: ["addip 0 {{ ip }}", "writeip"]
    remove: ["removeip {{ ip }}", "writeip"]
    file: { path: cstrike/listip.cfg, format: lines, pattern: '^addip\s+\S+\s+(\S+)', line: "addip 0.000000 {{ ip }}" }

query:
  protocol: goldsrc
