id: minecraft-java
name: "Minecraft: Java Edition"
description: Vanilla, Paper (plugins), or Fabric, Forge and NeoForge (mods).
# One "Minecraft" tile in the game picker, with a switch between editions.
group: { id: minecraft, name: Minecraft, variant: Java, order: 0 }
icon: icons/minecraft-java.svg
color: "#2d4a1e"
# Fetched and cached by the panel at runtime, not stored in this repository.
art:
  icon: https://images.icon-icons.com/3053/PNG/512/minecraft_macos_bigsur_icon_189943.png
  cover: https://cdn2.steamgriddb.com/hero_thumb/043ab21fc5a1607b381ac3896176dac6.jpg

fields:
  - id: loader
    label: Server software
    type: select
    default: paper
    options:
      - { value: vanilla, label: Vanilla }
      - { value: paper, label: Paper (plugins) }
      - { value: fabric, label: Fabric (mods) }
      - { value: forge, label: Forge (mods) }
      - { value: neoforge, label: NeoForge (mods) }

  - id: version
    label: Minecraft version
    type: select
    required: true
    options_from: minecraft.versions
    depends_on: [loader]
    on_change: reinstall

  - id: loader_version
    label: Mod loader version
    type: select
    required: true
    options_from: minecraft.loader_versions
    depends_on: [loader, version]
    visible_if: { loader: [fabric, forge, neoforge] }
    on_change: reinstall

  - id: memory_mb
    label: Memory (MB)
    type: number
    default: 2048
    min: 512
    max: 65536
    editable: true
    on_change: restart

  - id: eula
    label: I accept the Minecraft EULA
    type: boolean
    must_be: true
    help_url: https://aka.ms/MinecraftEULA

  - id: rcon_password
    label: RCON password
    type: secret
    generate: true
    hidden: true

ports:
  - { name: game, container: 25565, protocol: tcp, default_host: 25565 }

# Same image, but only downloads the server and exits: "create" leaves a ready-to-start server.
install:
  image: "itzg/minecraft-server:{{ minecraft_java_tag(version) }}"
  env:
    SETUP_ONLY: "true"

runtime:
  image: "itzg/minecraft-server:{{ minecraft_java_tag(version) }}"
  env:
    EULA: "TRUE"
    TYPE: "{{ loader | upper }}"
    VERSION: "{{ version }}"
    # Each loader reads its own variable; the others render empty and stay unset.
    FABRIC_LOADER_VERSION: "{{ loader_version if loader == 'fabric' else '' }}"
    FORGE_VERSION: "{{ loader_version if loader == 'forge' else '' }}"
    NEOFORGE_VERSION: "{{ loader_version if loader == 'neoforge' else '' }}"
    MEMORY: "{{ memory_mb }}M"
    RCON_PASSWORD: "{{ rcon_password }}"
    # Mojang's CDN often resolves to IPv6 first; Docker networks usually have no IPv6 route,
    # and Java then fails with "Network is unreachable" instead of falling back to IPv4.
    JVM_OPTS: "-Djava.net.preferIPv4Stack=true"
  stop:
    command: stop
    timeout: 60
  data_path: /data
  resources:
    # Worlds grow as players explore; mods and plugins add up too.
    disk_mb: "10240"
    # The heap plus what Java needs outside it (threads, native memory, the JIT).
    memory_mb: "{{ memory_mb + [memory_mb // 4, 768] | max }}"

config_files:
  - id: server_properties
    label: Server properties
    path: server.properties
    format: properties
    # Container port and RCON are wired up by the panel.
    managed: [server-port, enable-rcon, rcon.port, rcon.password, query.port]
    # Only keys present in the file are shown, so versions that dropped or renamed one are fine.
    hints:
      motd: { label: Message of the day }
      # The world stores its own difficulty: this value only seeds new worlds.
      difficulty: { label: Difficulty, type: select, options: [peaceful, easy, normal, hard], help: "For a new world. In an existing one use the console: difficulty hard" }
      gamemode: { label: Default game mode, type: select, options: [survival, creative, adventure, spectator], help: For players joining for the first time. }
      hardcore: { label: Hardcore, type: boolean, help: For a new world. }
      pvp: { label: PvP, type: boolean }
      max-players: { label: Max players, type: number, min: 1, max: 1000 }
      online-mode: { label: Online mode, type: boolean, help: "Check accounts with Mojang. Turn off only for offline/LAN play." }
      white-list: { label: Whitelist, type: boolean }
      allow-flight: { label: Allow flight, type: boolean }
      allow-nether: { label: Allow the Nether, type: boolean }
      spawn-protection: { label: Spawn protection radius, type: number, min: 0, max: 1000 }
      view-distance: { label: View distance, type: number, min: 2, max: 32 }
      simulation-distance: { label: Simulation distance, type: number, min: 3, max: 32 }
      level-seed: { label: World seed, help: Only used when a new world is generated. }

backup:
  # Downloaded again by the server on start: no need to keep them in every backup.
  exclude: [cache, libraries, versions, logs, .cache]
  # Pause autosave so the world isn't written to while it's archived.
  before: [save-off, save-all flush]
  after: [save-on]
  wait: 5

console:
  # Paper: "[12:00:00 WARN]: ...", vanilla/Fabric: "[12:00:00] [Server thread/WARN]: ..."
  highlight:
    - { pattern: '^(\[[^\]]*\] )?\[[^\]]*[ /](ERROR|FATAL|SEVERE)\]', color: red }
    - { pattern: '^(\[[^\]]*\] )?\[[^\]]*[ /]WARN(ING)?\]', color: yellow }
    - { pattern: '^(WARN |\*\*\* Warning)', color: yellow }
    - { pattern: '^\[init\]|\tmc-server-runner\t', color: gray }
  continuation: '^(\s+at |\s*\.\.\. \d+ more|Caused by: |[\w.$]+(Exception|Error)(: |$))'

players:
  key: name
  events:
    # Before the join, in online mode: "UUID of player Steve is 069a79f4-44e9-4726-a5be-fca90e38aaf5"
    - { type: info, pattern: 'UUID of player (?P<name>\w{1,16}) is (?P<id>[0-9a-f-]{36})' }
    # "Steve[/203.0.113.9:53012] logged in with entity id 123 at (...)". Chat lines start with <name>, so they can't pass for these.
    - { type: join, pattern: '\]: (?P<name>\w{1,16})\[/(?P<ip>[^\]]+):\d+\] logged in with entity id' }
    - { type: leave, pattern: '\]: (?P<name>\w{1,16}) left the game$' }
  status:
    command: list
    # "There are 2 of a max of 20 players online: Steve, Alex"
    names: '\]: There are \d+ (?:of a max of|out of maximum) \d+ players online[.:]\s*(?P<names>.*)$'
  avatars: minecraft
  kick: ["kick {{ name }}{{ ' ' ~ reason if reason }}"]
  bans:
    by: name
    add: ["ban {{ name }}{{ ' ' ~ reason if reason }}"]
    remove: ["pardon {{ name }}"]
    # While the server is stopped the panel writes the list itself; the game rewrites it while running.
    file:
      path: banned-players.json
      format: json
      field: name
      entry:
        uuid: "{{ id }}"
        name: "{{ name }}"
        created: "{{ now }}"
        source: PossumDocker
        expires: "{{ expires }}"
        reason: "{{ reason or 'Banned by an operator.' }}"
  ip_bans:
    add: ["ban-ip {{ ip }}{{ ' ' ~ reason if reason }}"]
    remove: ["pardon-ip {{ ip }}"]
    file:
      path: banned-ips.json
      format: json
      field: ip
      entry:
        ip: "{{ ip }}"
        created: "{{ now }}"
        source: PossumDocker
        expires: "{{ expires }}"
        reason: "{{ reason or 'Banned by an operator.' }}"

query:
  protocol: minecraft
